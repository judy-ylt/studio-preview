<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡通照｜精修工作台討論版</title><link rel="stylesheet" href="../ui-kit/person-workbench-system/light-tokens.css?v=20261104-1"><link rel="stylesheet" href="../ui-kit/person-workbench.css?v=20261105-1"><link rel="stylesheet" href="bubble-workbench.css?v=20261105-7"><link rel="stylesheet" href="../ui-kit/workbench-atmosphere.css?v=20261105-1"><link rel="stylesheet" href="refined-workbench.css?v=20261106-1"><link rel="stylesheet" href="../ui-kit/balance-in-frame.css?v=20261106-2"></head>
<body data-station="cartoon">
<main class="workbench"><aside class="left-panel" aria-label="卡通照設定"><h1>卡通照</h1><div id="source"></div><div id="navigation"></div></aside>
<section class="center-panel" aria-labelledby="stageTitle"><div class="stage-heading"><div><span id="stageKicker" class="muted"></span><h2 id="stageTitle"></h2></div><button class="help" id="stageHelp" aria-label="畫面說明">?</button></div><div id="stage"></div><div id="stageActions"></div></section>
<aside class="right-panel" aria-label="細節與費用"><header class="balance-bar" aria-label="點數"><span>剩餘 <strong>200</strong> 點 <span class="badge">示意</span></span></header><div id="inspector" class="inspector"></div><section class="checkout" aria-label="製作費用"><p id="missing" class="warning"></p><div><span id="count">共 0 張</span><strong id="cost">0 點</strong></div><p id="remaining" class="muted">製作後剩 200 點</p><button class="primary" id="review" disabled>確認並生成</button></section></aside></main>
<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<dialog id="photoDialog" aria-labelledby="photoTitle"><div class="dialog-heading"><h2 id="photoTitle">加入人物照片</h2><button class="close" data-close="photoDialog" aria-label="關閉照片選擇">×</button></div><p class="muted upload-tip">想做全身圖，請上傳全身照；只有大頭照時，下半身會由 AI 推測。</p><button class="primary" id="uploadFile">從電腦上傳</button><div class="section-heading"><h3>曾上傳的照片</h3><button class="help" data-help="新照片只保存在此瀏覽器；範例供體驗。" aria-label="照片保存說明">?</button></div><div id="photoHistory" class="photo-grid"></div></dialog>
<dialog id="reviewDialog" aria-labelledby="reviewTitle"><div class="dialog-heading"><h2 id="reviewTitle">確認這次的製作</h2><button class="close" data-close="reviewDialog" aria-label="關閉確認">×</button></div><div id="reviewContent"></div><p id="reviewTotal"></p><div class="dialog-actions"><button class="secondary" data-close="reviewDialog">返回調整</button><button id="generate" class="primary">生成示意</button></div></dialog>
<dialog id="resultsDialog" aria-labelledby="resultsTitle"><div class="dialog-heading"><h2 id="resultsTitle">示意成果</h2><button class="close" data-close="resultsDialog" aria-label="關閉成果">×</button></div><p class="muted">以下為 PNG 範例素材，依設定呈現背景與比例；未依你的照片、心情、構圖或風格程度生成。下載檔含 DEMO 標記。</p><div id="results" class="result-grid"></div><div class="dialog-actions"><button class="secondary" data-close="resultsDialog">返回工作台</button><button id="redo" class="secondary">重新生成</button></div><div id="regenPanel" hidden><label>想調整哪裡？<select id="regenReason"><option>人物不像</option><option>風格不對</option><option>背景／動作不對</option><option>文字不對</option><option>其他</option></select></label><button id="redoConfirm" class="primary">記錄原因並返回調整</button></div></dialog>
<div id="helpBubble" role="tooltip" hidden></div><p id="status" role="status" aria-live="polite"></p>
<script src="workbench-data.js?v=20261104-1"></script><script src="refined-workbench.js?v=20261106-6"></script></body></html>
